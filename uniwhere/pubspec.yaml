name: uniwhere
description: "UNIwhere - Sistema de navegación indoor con AR para campus universitarios"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # AR Plugin para ARCore (Android) / ARKit (iOS)
  ar_flutter_plugin_plus: ^1.0.0

  # Cámara para captura de frames y envío al backend
  camera: ^0.11.0+2

  # Matemáticas 3D y cálculos vectoriales para AR
  vector_math: ^2.1.4

  # HTTP para llamadas al backend FastAPI (localhost:8000)
  http: ^1.2.1

  # Estado global con patrón Provider
  provider: ^6.1.1

  # Guardar configuraciones (IP del backend, modo debug)
  shared_preferences: ^2.3.2

  # Indicadores de carga animados (SpinKit)
  flutter_spinkit: ^5.2.0

  # Gestión de permisos en runtime
  permission_handler: ^12.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
    - assets/models/
